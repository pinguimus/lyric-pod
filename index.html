<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lyric Pod</title>
<meta name="description" content="Reproductor estilo iPod con letras sincronizadas, online y offline">
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <main class="ipod" id="ipod">
    <div class="bezel">
      <div class="screen" id="screen">
        <div class="hd">
          <button type="button" id="back" aria-label="Atrás">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <h1 id="ttl">Lyric Pod</h1>
          <span class="pi" id="pi" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"></path></svg>
          </span>
        </div>
        <div class="pg" id="pg"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div class="wheel">
      <button type="button" class="wb m" id="bMenu" aria-label="Menú (mantén pulsado para ir al inicio)">MENU</button>
      <button type="button" class="wb l" id="bPrev" aria-label="Anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5l-9 7 9 7zM10 5l-9 7 9 7z"></path></svg>
      </button>
      <button type="button" class="wb r" id="bNext" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l9 7-9 7zM14 5l9 7-9 7z"></path></svg>
      </button>
      <button type="button" class="wb p" id="bPlay" aria-label="Reproducir o pausar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4l9 8-9 8zM14 4h3.5v16H14zM19.5 4H23v16h-3.5z"></path></svg>
      </button>
      <button type="button" class="wb c" id="bSel" aria-label="Seleccionar"></button>
    </div>
  </main>
</div>

<noscript><p style="color:#fff;text-align:center">Lyric Pod necesita JavaScript para funcionar.</p></noscript>
<script src="app.js"></script>
</body>
</html>
